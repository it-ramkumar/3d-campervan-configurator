applications:
  - appRoot: frontend
    customHeaders:
      - pattern: "**/*.webp"
        headers:
          - key: "Cache-Control"
            value: "public, max-age=31536000, immutable"
      - pattern: "**/*.jpg"
        headers:
          - key: "Cache-Control"
            value: "public, max-age=31536000, immutable"
      - pattern: "**/*.png"
        headers:
          - key: "Cache-Control"
            value: "public, max-age=31536000, immutable"
      - pattern: "/_next/static/**"
        headers:
          - key: "Cache-Control"
            value: "public, max-age=31536000, immutable"