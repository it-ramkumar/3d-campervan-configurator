<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Custom van conversions</title>
<script>
/* Embedded on the home page (?embed=1): the page renders the headline, buttons and loader itself */
if (new URLSearchParams(location.search).has('embed')) document.documentElement.classList.add('embed');
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0E2C49; --navy-2:#0A2139; --grid:rgba(160,205,240,.09); --grid-strong:rgba(160,205,240,.16);
  --ink:#F3F7FA; --muted:#A9C1D6; --amber:#FFB547; --amber-ink:#2B1A00; --line:rgba(169,193,214,.35);
  color-scheme:dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --navy:#0E2C49; --navy-2:#0A2139; } }
:root[data-theme="dark"]{ --navy:#0E2C49; --navy-2:#0A2139; }
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;overflow:hidden;color:var(--ink);font-family:"Archivo",system-ui,sans-serif;
  background:
    radial-gradient(90% 80% at 65% 55%, transparent 40%, var(--navy-2) 100%),
    linear-gradient(var(--grid-strong) 1px, transparent 1px) 0 0/120px 120px,
    linear-gradient(90deg, var(--grid-strong) 1px, transparent 1px) 0 0/120px 120px,
    linear-gradient(var(--grid) 1px, transparent 1px) 0 0/24px 24px,
    linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0/24px 24px,
    var(--navy);}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}

.copy{position:fixed;left:calc(env(safe-area-inset-left,0px) + clamp(20px,6vw,88px));top:50%;transform:translateY(-50%);max-width:min(520px,42vw);pointer-events:none}
.copy > *{pointer-events:auto}
.copy h1{margin:0 0 18px;font-stretch:118%;font-weight:850;font-size:clamp(2.4rem,5.2vw,4.6rem);line-height:.95;letter-spacing:-.015em}
.copy h1 span{display:block;color:var(--muted);font-weight:600}
.copy p{margin:0 0 26px;font-size:clamp(1rem,1.25vw,1.15rem);line-height:1.55;color:var(--muted);max-width:42ch}
.ctas{display:flex;gap:12px;flex-wrap:wrap}
.btn{font:inherit;font-weight:750;font-stretch:105%;font-size:1rem;text-decoration:none;border-radius:6px;padding:14px 22px;cursor:pointer;border:0;display:inline-block}
.btn.primary{background:var(--amber);color:var(--amber-ink)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

.build{position:fixed;left:calc(env(safe-area-inset-left,0px) + clamp(20px,6vw,88px));bottom:calc(env(safe-area-inset-bottom,0px) + 28px);display:flex;align-items:center;gap:16px}
.steps{display:flex;gap:5px;list-style:none;margin:0;padding:0}
.steps li{width:26px;height:4px;border-radius:2px;background:var(--line);transition:background .3s}
.steps li.done{background:var(--amber)}
.caption{font-size:.95rem;font-weight:600;min-width:220px;font-variant-numeric:tabular-nums}
.caption small{display:block;color:var(--muted);font-weight:500;font-size:.82rem}

.tools{position:fixed;right:calc(env(safe-area-inset-right,0px) + 20px);bottom:calc(env(safe-area-inset-bottom,0px) + 22px);display:flex;gap:8px}
.tools button{font:inherit;font-weight:650;font-size:.9rem;background:rgba(10,33,57,.6);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:9px 13px;cursor:pointer;backdrop-filter:blur(6px)}
.tools button[aria-pressed="true"]{background:var(--ink);color:var(--navy)}
.tools button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

.dim{position:fixed;font-size:.75rem;color:var(--muted);letter-spacing:.02em;pointer-events:none;opacity:0;transition:opacity .6s;white-space:nowrap}
.loading{position:fixed;right:24px;top:24px;font-size:.85rem;color:var(--muted)}

@media (max-width:820px), (orientation:portrait){
  .copy{top:calc(env(safe-area-inset-top,0px) + 28px);transform:none;max-width:none;right:20px}
  .copy h1{font-size:clamp(2.1rem,9vw,3rem);margin-bottom:12px}
  .copy p{margin-bottom:18px;font-size:.98rem}
  .build{bottom:calc(env(safe-area-inset-bottom,0px) + 74px)}
  .tools{left:20px;right:auto}
  .caption{min-width:0}
}
@media (max-width:420px){ .steps li{width:16px} }
.embed .copy, .embed .loading{display:none}
</style>
</head>
<body>
<canvas id="c" aria-label="Animation: an empty van being fitted out with a kitchen, shower, bed and storage"></canvas>

<section class="copy">
  <h1>Empty van in.<span>Home on wheels out.</span></h1>
  <p>We design and build custom van conversions around the way you travel, with a kitchen, shower, bed and storage made to fit your van.</p>
  <div class="ctas">
    <a class="btn primary" href="/contact" target="_top">Start your build</a>
    <a class="btn ghost" href="/camper-vans-for-sale" target="_top">See our vans</a>
  </div>
</section>

<div class="build" aria-live="polite">
  <ol class="steps" id="steps"></ol>
  <div class="caption" id="caption"><small>Step 1</small>Empty van</div>
</div>

<div class="tools">
  <button id="replay">Build it again</button>
  <button id="xray" aria-pressed="false">See inside</button>
</div>
<div class="loading" id="loading">Loading the van…</div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
/* ===== EDIT HERE: build order and the names shown while each part goes in ===== */
const MODEL_URL = 'van.glb';
const BUILD = [
  ['Bad platform',       'Bed platform'],
  ['becnhes',            'Dinette benches'],
  ['lagoon table',       'Swivel table'],
  ['tall cabinet',       'Tall cabinet'],
  ['Big Kicthen',        'Kitchen'],
  ['shower',             'Shower and toilet'],
  ['upper cabinet',      'Overhead cabinets'],
  ['double swiell seat', 'Swivel seats']
];
/* ============================================================================= */
(() => {
const $ = id => document.getElementById(id);
// Tell the page hosting this iframe (same origin) when the van is ready or failed, so it can drop its loader
const notifyHost = type => { if (window.parent !== window) window.parent.postMessage({ source: 'van-hero', type }, location.origin); };
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const coarse = matchMedia('(pointer:coarse)').matches;

const renderer = new THREE.WebGLRenderer({canvas:$('c'), antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1, 1.75));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.setClearColor(0,0);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 200);
camera.position.set(9.5, 4.2, 10.5);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0,1.1,0); controls.enableZoom=false; controls.enablePan=false; controls.enableDamping=true;
controls.minPolarAngle=0.6; controls.maxPolarAngle=1.45; controls.autoRotate=!reduce; controls.autoRotateSpeed=0.55;
// Touch screens: vertical swipes scroll the page, horizontal swipes turn the van.
// OrbitControls calls preventDefault() on every touchstart/touchmove unless disabled (and sets
// touch-action:none), which traps visitors on the hero, so it is turned off here. With
// touch-action:pan-y the browser keeps vertical pans for scrolling (and sends pointercancel),
// while horizontal moves arrive as pointer events that we turn into rotation. Auto-rotate keeps
// working with the controls off (update() rotates regardless of `enabled`).
if(coarse){
  controls.enabled=false;
  const el=renderer.domElement; el.style.touchAction='pan-y';
  const up=new THREE.Vector3(0,1,0), offset=new THREE.Vector3();
  let dragX=null, resumeTimer=0;
  const turn=dx=>{ // same speed as OrbitControls' own drag: a full screen height = one full turn
    offset.copy(camera.position).sub(controls.target).applyAxisAngle(up,-2*Math.PI*dx/el.clientHeight);
    camera.position.copy(controls.target).add(offset);
  };
  el.addEventListener('pointerdown',e=>{ if(e.pointerType!=='touch') return; dragX=e.clientX; controls.autoRotate=false; clearTimeout(resumeTimer); });
  el.addEventListener('pointermove',e=>{ if(dragX===null||e.pointerType!=='touch') return; turn(e.clientX-dragX); dragX=e.clientX; });
  const endDrag=()=>{ if(dragX===null) return; dragX=null; resumeTimer=setTimeout(()=>{ controls.autoRotate=!reduce; },2500); };
  el.addEventListener('pointerup',endDrag); el.addEventListener('pointercancel',endDrag);
}

scene.add(new THREE.HemisphereLight('#dfefff','#24425f',0.9));
const key = new THREE.DirectionalLight('#fff1dc',1.6); key.position.set(6,10,7); key.castShadow=true;
key.shadow.mapSize.set(2048,2048); Object.assign(key.shadow.camera,{left:-6,right:6,top:6,bottom:-6,near:1,far:30}); key.shadow.bias=-0.0005; scene.add(key);
const rim = new THREE.DirectionalLight('#7fc4ff',0.9); rim.position.set(-8,5,-6); scene.add(rim);
const shadowFloor = new THREE.Mesh(new THREE.CircleGeometry(8,64), new THREE.ShadowMaterial({opacity:.35}));
shadowFloor.rotation.x=-Math.PI/2; shadowFloor.receiveShadow=true; scene.add(shadowFloor);
// blueprint footprint lines
const lineMat = new THREE.LineBasicMaterial({color:'#8fc8f0', transparent:true, opacity:.45});
const foot = new THREE.Group();
{ const w=1.0, l=3.75; const pts=[[-w,-l],[w,-l],[w,l],[-w,l],[-w,-l]].map(p=>new THREE.Vector3(p[0],0.005,p[1]));
  foot.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), lineMat));
  const dl=[[ -1.45,-l],[-1.45,l]], ticks=[[-1.6,-l],[-1.3,-l],[-1.6,l],[-1.3,l]];
  foot.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(dl.map(p=>new THREE.Vector3(p[0],0.005,p[1]))), lineMat));
  foot.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(ticks.map(p=>new THREE.Vector3(p[0],0.005,p[1]))), lineMat)); }
scene.add(foot);

const envCube = (()=>{ const f=[]; for(let i=0;i<6;i++){ const cv=document.createElement('canvas'); cv.width=cv.height=64; const g=cv.getContext('2d');
  if(i===2) g.fillStyle='#e8f2fb'; else if(i===3) g.fillStyle='#1b3550'; else { const gr=g.createLinearGradient(0,0,0,64); gr.addColorStop(0,'#dbe9f5'); gr.addColorStop(.5,'#7f9db8'); gr.addColorStop(1,'#1b3550'); g.fillStyle=gr; }
  g.fillRect(0,0,64,64); f.push(cv);} const t=new THREE.CubeTexture(f); t.encoding=THREE.sRGBEncoding; t.needsUpdate=true; return t; })();

// blueprint "ghost" material for the empty shell
const ghostMat = new THREE.ShaderMaterial({
  transparent:true, depthWrite:false, side:THREE.DoubleSide, blending:THREE.AdditiveBlending,
  uniforms:{ uColor:{value:new THREE.Color('#7fc8ff')}, uAlpha:{value:1} },
  vertexShader:`varying vec3 vN; varying vec3 vV; void main(){ vec4 mv=modelViewMatrix*vec4(position,1.0); vN=normalize(normalMatrix*normal); vV=-mv.xyz; gl_Position=projectionMatrix*mv; }`,
  fragmentShader:`uniform vec3 uColor; uniform float uAlpha; varying vec3 vN; varying vec3 vV;
    void main(){ float r=1.0-abs(dot(normalize(vN),normalize(vV))); float a=(pow(r,2.2)*0.55+0.025)*uAlpha; gl_FragColor=vec4(uColor*a,a); }`
});

// ---------- model ----------
const clean = s => s.replace(/\s/g,'_');
let shell=null; const parts=[]; let ready=false;
async function loadModel(){
  const emb=document.getElementById('van-data');
  if(emb && emb.textContent.trim().length>100){
    const raw=atob(emb.textContent.trim()); const bin=new Uint8Array(raw.length); for(let i=0;i<raw.length;i++) bin[i]=raw.charCodeAt(i);
    const buf=await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();
    const saved=window.createImageBitmap; try{ window.createImageBitmap=undefined; }catch(e){}
    const g=await new Promise((res,rej)=>new THREE.GLTFLoader().parse(buf,'',res,rej));
    try{ window.createImageBitmap=saved; }catch(e){} return g;
  }
  const l=new THREE.GLTFLoader(); const d=new THREE.DRACOLoader(); d.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.4.1/'); l.setDRACOLoader(d);
  return new Promise((res,rej)=>l.load(MODEL_URL,res,undefined,rej));
}
function prepMeshes(obj){
  const meshes=[]; obj.traverse(o=>{ if(!o.isMesh) return; o.castShadow=true; o.receiveShadow=true;
    const m=o.material; if(m.transmission>0){ m.transmission=0; m.transparent=true; m.opacity=.35; m.depthWrite=false; }
    m.envMap=envCube; m.envMapIntensity=1.1;
    o.userData.real=m; o.userData.realOpacity=m.opacity; o.userData.realTransparent=m.transparent; o.userData.realDepthWrite=m.depthWrite;
    meshes.push(o); }); return meshes;
}
function setup(g){
  const root=g.scene; root.scale.setScalar(0.001); root.position.set(0.012,0.128,-0.215); scene.add(root);
  const byName={}; root.children.forEach(o=>byName[o.name]=o);
  const vanObj = byName['van']; if(vanObj) shell={obj:vanObj, meshes:prepMeshes(vanObj)};
  BUILD.forEach(([k,label])=>{ const o=byName[clean(k)]||byName[k]; if(!o) return; parts.push({obj:o, label, baseY:o.position.y, baseS:o.scale.clone(), meshes:prepMeshes(o)}); });
  const st=$('steps'); st.innerHTML=''; for(let i=0;i<parts.length+2;i++) st.appendChild(document.createElement('li'));
  ready=true; $('loading').remove(); restart();
  // wait one frame so the first rendered frame is on screen before the host fades its loader out
  requestAnimationFrame(() => notifyHost('ready'));
}

// ---------- build timeline ----------
const GHOST_IN=1.2, FIRST=1.6, GAP=0.95, DROP=1.1, SOLID=1.6;
const solidStart = () => FIRST + parts.length*GAP + 0.5;
let T=0, xray=false, lastStep=-1;
const easeOutBack = x => { const c1=1.4, c3=c1+1; return 1 + c3*Math.pow(x-1,3) + c1*Math.pow(x-1,2); };
const clamp01 = x => Math.max(0,Math.min(1,x));
function shellMode(m, solidK){
  if(!shell) return;
  shell.meshes.forEach(o=>{
    if(m==='ghost'){ o.material=ghostMat; o.castShadow=false; }
    else { const r=o.userData.real; o.material=r; o.castShadow = solidK>=1;
      const faded = solidK<1; r.transparent = faded || o.userData.realTransparent; r.opacity = o.userData.realOpacity*solidK; r.depthWrite = !faded && o.userData.realDepthWrite; }
  });
}
function restart(){ T = reduce ? 99 : 0; lastStep=-1; xray=false; $('xray').setAttribute('aria-pressed','false'); }
function setCaption(i){
  if(i===lastStep) return; lastStep=i;
  const lis=[...document.querySelectorAll('#steps li')]; lis.forEach((li,k)=>li.classList.toggle('done', k<=i));
  const total=parts.length+2;
  let txt = i===0 ? 'Empty van' : i<=parts.length ? 'Fitting the '+parts[i-1].label.toLowerCase() : 'Ready for the road';
  $('caption').innerHTML = '<small>Step '+(i+1)+' of '+total+'</small>'+txt;
}
function updateBuild(dt){
  T += dt;
  ghostMat.uniforms.uAlpha.value = clamp01(T/GHOST_IN);
  let step = 0;
  parts.forEach((p,i)=>{
    const t0 = FIRST + i*GAP, k = clamp01((T-t0)/DROP);
    p.obj.visible = k>0;
    p.obj.position.y = p.baseY + (1-easeOutBack(k))*2600;
    const s = 0.85 + 0.15*easeOutBack(k); p.obj.scale.copy(p.baseS).multiplyScalar(s);
    if(T>=t0) step = i+1;
  });
  const sk = clamp01((T-solidStart())/SOLID);
  if(xray || sk<=0){ shellMode('ghost'); ghostMat.uniforms.uAlpha.value = xray ? 1 : clamp01(T/GHOST_IN); }
  else shellMode('solid', sk);
  if(sk>0) step = parts.length+1;
  setCaption(step);
  lineMat.opacity = 0.45*(1-sk*0.7);
}
$('replay').onclick = ()=>{ restart(); };
$('xray').onclick = ()=>{ xray=!xray; if(T<solidStart()+SOLID) T=solidStart()+SOLID; $('xray').setAttribute('aria-pressed', String(xray)); };

// ---------- layout: keep the van beside / below the headline ----------
function resize(){
  const w=innerWidth, h=innerHeight; renderer.setSize(w,h,false); camera.aspect=w/h;
  const portrait = w<820 || h>w;
  if(portrait){ camera.fov=40; camera.setViewOffset(w,h,0,-h*0.2,w,h); controls.target.set(0,1.1,0); }
  else { camera.fov=30; camera.setViewOffset(w,h,-w*0.2,-h*0.02,w,h); }
  camera.updateProjectionMatrix();
}
addEventListener('resize',resize); resize();

// fallback for GPUs that draw lit surfaces black
let SAFE=false, frame=0;
function enterSafe(){ SAFE=true; renderer.shadowMap.enabled=false; const all=[...(shell?shell.meshes:[]), ...parts.flatMap(p=>p.meshes)];
  all.forEach(o=>{ const m=o.userData.real; if(!m||!m.isMeshStandardMaterial) return; const n=new THREE.MeshLambertMaterial({color:m.color,map:m.map||null,transparent:m.transparent,opacity:m.opacity,side:m.side,emissive:m.emissive||new THREE.Color(0),vertexColors:m.vertexColors}); o.userData.real=n; if(o.material===m) o.material=n; }); }
function looksBlack(){ const gl=renderer.getContext(),w=gl.drawingBufferWidth,h=gl.drawingBufferHeight,px=new Uint8Array(4); let d=0, tx=resizeCenter();
  for(const [fx,fy] of [[0,0],[-.04,.02],[.04,.02],[0,.05]]){ gl.readPixels(((tx[0]+fx)*w)|0,((tx[1]+fy)*h)|0,1,1,gl.RGBA,gl.UNSIGNED_BYTE,px); if(px[3]>200&&px[0]+px[1]+px[2]<4) d++; } return d>=3; }
function resizeCenter(){ const p=innerWidth<820||innerHeight>innerWidth; return p?[.5,.3]:[.7,.48]; }

// pause when the hero is off screen or the tab is hidden
let visible=true;
if('IntersectionObserver' in window) new IntersectionObserver(es=>{ visible=es[0].isIntersecting; }).observe($('c'));
const clock=new THREE.Clock();
function tick(){
  requestAnimationFrame(tick);
  const dt=Math.min(clock.getDelta(),.05);
  if(!visible || document.hidden) return;
  if(ready) updateBuild(dt);
  controls.update(); renderer.render(scene,camera);
  frame++; if(ready && !SAFE && !xray && T>solidStart()+SOLID+0.5 && frame%45===0 && frame<3000 && looksBlack()) enterSafe();
}
tick();
loadModel().then(setup).catch(e=>{ console.error(e); $('loading').textContent='The van didn’t load. Reload the page to try again.'; notifyHost('error'); });
})();
</script>
</body>
</html>
